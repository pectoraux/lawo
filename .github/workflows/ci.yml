# Nomos — CI Gate
#
# Every PR and push to main must pass:
#   lint → typecheck → arch-test (static) → runtime-test (integration) → build
#
# The runtime-test job uses a Postgres service container with a fresh schema
# each run. The test script creates its own fixtures (tenants, users, decisions)
# and cleans them up, so the DB is left pristine.
#
# Anti-drift strategy: the architecture tests (static + runtime) are the
# permanent gate that prevents the implementation from drifting from the
# frozen constitution. A PR is not mergeable unless both suites pass.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint + Typecheck (fast, runs first)
  # ---------------------------------------------------------------------------
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.ci.json

  # ---------------------------------------------------------------------------
  # Job 2: Static architecture tests (source-structure checks)
  # ---------------------------------------------------------------------------
  arch-test:
    name: Static Architecture Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run architecture tests
        run: bun run arch-test

  # ---------------------------------------------------------------------------
  # Job 3: Runtime security tests (integration — hits API + DB)
  # ---------------------------------------------------------------------------
  runtime-test:
    name: Runtime Security Tests
    runs-on: ubuntu-latest
    needs: arch-test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nomos_test
          POSTGRES_PASSWORD: nomos_test
          POSTGRES_DB: nomos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nomos_test:nomos_test@localhost:5432/nomos_test?schema=public
      DIRECT_URL: postgresql://nomos_test:nomos_test@localhost:5432/nomos_test?schema=public
      NEXTAUTH_SECRET: ci-test-secret-not-for-production-32-chars-min
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_DEMO_AUTH_ENABLED: 'true'
      RATE_LIMIT_ALLOW_IN_MEMORY: '1'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Push schema to test DB
        run: bunx prisma db push --accept-data-loss

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Seed demo + admin accounts
        run: bun run scripts/seed-users.ts

      - name: Start dev server and run runtime tests
        run: |
          # Start the dev server in the background WITHIN this step.
          # Each GitHub Actions step runs in its own shell, so the server
          # must be started and tested in the same step to stay alive.
          nohup bunx next dev -p 3000 > server.log 2>&1 &
          SERVER_PID=$!
          # Wait for the server to be ready
          for i in $(seq 1 60); do
            if curl -s --max-time 2 -o /dev/null http://localhost:3000/api/auth/csrf; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          # Final health check
          curl -s --max-time 5 -o /dev/null http://localhost:3000/api/auth/csrf || (echo "Server failed to start" && cat server.log && exit 1)
          # Run the tests while the server is still running in this step
          bun run tests/runtime-security/run.ts
          TEST_EXIT=$?
          # Kill the server
          kill $SERVER_PID 2>/dev/null || true
          exit $TEST_EXIT

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: server.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4: Build (proves the project compiles for deployment)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: runtime-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: build-time-placeholder-not-used-at-runtime
          NEXTAUTH_URL: https://lawo.vercel.app
        run: bun run build
